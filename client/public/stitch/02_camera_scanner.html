<!-- Interactive Micro-Scripts for Native iOS Feel -->
<script>
    // Segmented Control Switcher
    const btnSingle = document.getElementById('btnSingleSided');
    const btnDouble = document.getElementById('btnDoubleSided');

    btnSingle.addEventListener('click', () => {
      btnSingle.className = "flex-1 py-1 text-center font-headline text-footnote text-on-surface bg-surface-container-lowest rounded-[8px] shadow-[0_3px_8px_rgba(0,0,0,0.08),0_1px_2px_rgba(0,0,0,0.04)] transition-all";
      btnDouble.className = "flex-1 py-1 text-center font-subheadline text-footnote text-secondary hover:text-on-surface active:opacity-70 transition-all";
    });

    btnDouble.addEventListener('click', () => {
      btnDouble.className = "flex-1 py-1 text-center font-headline text-footnote text-on-surface bg-surface-container-lowest rounded-[8px] shadow-[0_3px_8px_rgba(0,0,0,0.08),0_1px_2px_rgba(0,0,0,0.04)] transition-all";
      btnSingle.className = "flex-1 py-1 text-center font-subheadline text-footnote text-secondary hover:text-on-surface active:opacity-70 transition-all";
    });

    // Torch & Flash Toggles
    const torch = document.getElementById('torchBtn');
    let torchActive = false;
    torch.addEventListener('click', () => {
      torchActive = !torchActive;
      torch.classList.toggle('bg-primary-container', torchActive);
      torch.classList.toggle('text-on-primary-container', torchActive);
    });

    const flash = document.getElementById('flashBtn');
    let flashActive = false;
    flash.addEventListener('click', () => {
      flashActive = !flashActive;
      flash.classList.toggle('bg-primary-container', flashActive);
      flash.classList.toggle('text-on-primary-container', flashActive);
    });

    // Shutter Haptic Simulation
    const shutter = document.getElementById('shutterBtn');
    shutter.addEventListener('click', () => {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(30);
      }
    });
  </script>
